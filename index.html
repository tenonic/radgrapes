<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Castle Defense</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      background: #223;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>

  <script>
    // Get the canvas and its "context", which is what we draw with.
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Draw images with sharp, blocky pixels instead of blurring them.
    ctx.imageSmoothingEnabled = false;

    // Load the castle picture.
    const castleImg = new Image();
    castleImg.src = "castle.png";

    // The castle: on the right edge, centered vertically.
    // Height keeps the picture's shape (444 wide x 596 tall).
    const castle = {
      width: 150,
      height: Math.round(150 * 596 / 444),
      x: canvas.width - 150,
      y: 0
    };
    castle.y = (canvas.height - castle.height) / 2;

    // The player: a small square that starts just left of the castle.
    const player = {
      size: 24,
      x: castle.x - 60,
      y: canvas.height / 2,
      speed: 4
    };

    // Lives, game over, and screen shake.
    const START_LIVES = 10;
    let lives = START_LIVES;
    let gameOver = false;
    let gameOverTime = 0;
    const SHAKE_MS = 300;
    let shakeUntil = 0;

    // Lose some lives. At 0 the game is over.
    function loseLives(amount) {
      lives = Math.max(0, lives - amount);
      if (lives === 0) {
        gameOver = true;
        gameOverTime = performance.now();
      }
    }

    // Put everything back to how it was at the start.
    function restart() {
      lives = START_LIVES;
      score = 0;
      bullets.length = 0;   // empties the array
      aliens.length = 0;
      player.x = castle.x - 60;
      player.y = canvas.height / 2;
      lastSpawnTime = performance.now();
      shakeUntil = 0;
      gameOver = false;
    }

    // Remember which keys are held down right now.
    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      // After Game Over, any key restarts. Wait 1 second first, so a key
      // you were already holding doesn't restart it instantly.
      if (gameOver && performance.now() - gameOverTime > 1000) restart();
    });
    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

    // Bullets the player has fired. Each one has a position (x, y) and a velocity (vx, vy).
    const bullets = [];
    const BULLET_SPEED = 8;
    const BULLET_RADIUS = 4;

    // Fire a bullet toward the mouse when the player clicks.
    canvas.addEventListener("mousedown", (e) => {
      if (gameOver) return;  // no shooting after Game Over

      // Mouse position relative to the canvas, not the whole page.
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Start from the center of the player.
      const startX = player.x + player.size / 2;
      const startY = player.y + player.size / 2;

      // Direction to the mouse, scaled so every bullet moves at the same speed.
      const dx = mouseX - startX;
      const dy = mouseY - startY;
      const distance = Math.hypot(dx, dy);
      if (distance === 0) return;  // clicked exactly on the player's center

      bullets.push({
        x: startX,
        y: startY,
        vx: (dx / distance) * BULLET_SPEED,
        vy: (dy / distance) * BULLET_SPEED
      });
    });

    // Aliens. Each one has a position (x, y) and a velocity (vx, vy).
    const aliens = [];
    const ALIEN_SPEED = 1.5;
    const ALIEN_RADIUS = 14;
    const SPAWN_EVERY_MS = 1000;
    let lastSpawnTime = 0;
    let score = 0;

    // Make a new alien on the left edge at a random height,
    // aimed at a random spot on the castle's front wall.
    function spawnAlien() {
      const x = ALIEN_RADIUS;
      const y = ALIEN_RADIUS + Math.random() * (canvas.height - ALIEN_RADIUS * 2);
      const targetX = castle.x;
      const targetY = castle.y + Math.random() * castle.height;
      const dx = targetX - x;
      const dy = targetY - y;
      const distance = Math.hypot(dx, dy);
      aliens.push({
        x: x,
        y: y,
        vx: (dx / distance) * ALIEN_SPEED,
        vy: (dy / distance) * ALIEN_SPEED
      });
    }

    // True if a rectangle (x, y, w, h) overlaps the castle's rectangle.
    function touchesCastle(x, y, w, h) {
      return x < castle.x + castle.width &&
             x + w > castle.x &&
             y < castle.y + castle.height &&
             y + h > castle.y;
    }

    // True if the player's square overlaps the castle.
    function touchingCastle() {
      return touchesCastle(player.x, player.y, player.size, player.size);
    }

    // Move the player based on the keys held down.
    function update() {
      let dx = 0, dy = 0;
      if (keys["arrowup"]    || keys["w"]) dy -= player.speed;
      if (keys["arrowdown"]  || keys["s"]) dy += player.speed;
      if (keys["arrowleft"]  || keys["a"]) dx -= player.speed;
      if (keys["arrowright"] || keys["d"]) dx += player.speed;

      // Move left/right, staying on screen. If that bumps into the castle, undo it.
      const oldX = player.x;
      player.x = Math.max(0, Math.min(player.x + dx, canvas.width - player.size));
      if (touchingCastle()) player.x = oldX;

      // Then move up/down the same way.
      const oldY = player.y;
      player.y = Math.max(0, Math.min(player.y + dy, canvas.height - player.size));
      if (touchingCastle()) player.y = oldY;

      // Move each bullet, and remove the ones that leave the screen.
      // (Loop backwards so removing one doesn't skip the next.)
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // Spawn a new alien once enough time has passed.
      const now = performance.now();
      if (now - lastSpawnTime >= SPAWN_EVERY_MS) {
        spawnAlien();
        lastSpawnTime = now;
      }

      // Move each alien, then check what it touched.
      for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        a.x += a.vx;
        a.y += a.vy;

        // The alien's bounding box (the square around its circle).
        const left = a.x - ALIEN_RADIUS;
        const top = a.y - ALIEN_RADIUS;
        const size = ALIEN_RADIUS * 2;

        const hitPlayer = left < player.x + player.size &&
                          left + size > player.x &&
                          top < player.y + player.size &&
                          top + size > player.y;

        if (hitPlayer) {
          aliens.splice(i, 1);
          loseLives(1);
        } else if (touchesCastle(left, top, size, size)) {
          aliens.splice(i, 1);
          loseLives(2);
          shakeUntil = now + SHAKE_MS;
        }
      }

      // Check every bullet against every alien. Two circles touch when the
      // distance between their centers is less than their two radii added together.
      for (let i = aliens.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const a = aliens[i];
          const b = bullets[j];
          if (Math.hypot(a.x - b.x, a.y - b.y) < ALIEN_RADIUS + BULLET_RADIUS) {
            aliens.splice(i, 1);
            bullets.splice(j, 1);
            score += 1;
            break;  // this alien is gone, so stop checking it
          }
        }
      }
    }

    // Draw everything.
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Screen shake: while it's active, draw everything nudged by a small
      // random amount. A new random nudge every frame makes it look shaky.
      ctx.save();
      if (performance.now() < shakeUntil) {
        const shakeX = (Math.random() - 0.5) * 16;
        const shakeY = (Math.random() - 0.5) * 16;
        ctx.translate(shakeX, shakeY);
      }

      ctx.drawImage(castleImg, castle.x, castle.y, castle.width, castle.height);

      ctx.fillStyle = "#4af";   // player: blue
      ctx.fillRect(player.x, player.y, player.size, player.size);

      ctx.fillStyle = "#ff4";   // bullets: yellow circles
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      // Aliens: green circles with two dark eyes.
      for (const a of aliens) {
        ctx.fillStyle = "#4d4";
        ctx.beginPath();
        ctx.arc(a.x, a.y, ALIEN_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111";
        ctx.fillRect(a.x - 6, a.y - 4, 4, 4);
        ctx.fillRect(a.x + 2, a.y - 4, 4, 4);
      }

      ctx.restore();  // stop shaking, so the text below stays still

      // Score and lives in the top-left corner.
      ctx.fillStyle = "#fff";
      ctx.font = "20px monospace";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 12, 28);
      ctx.fillText("Lives: " + lives, 12, 54);

      // Game Over screen: darken everything and show a message.
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f44";
        ctx.font = "48px monospace";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = "#fff";
        ctx.font = "20px monospace";
        ctx.fillText("Press any key to restart", canvas.width / 2, canvas.height / 2 + 40);
      }
    }

    // The game loop: update, draw, repeat (about 60 times per second).
    function loop() {
      if (!gameOver) update();  // freeze the game after Game Over, but keep drawing
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
